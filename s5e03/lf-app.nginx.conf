server {
        listen 443 ssl;
        server_name app.lf.test;

        ssl_certificate /etc/nginx/tls/app.lf.test.crt;
        ssl_certificate_key /etc/nginx/tls/app.lf.test.key;

        location / {
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_pass http://127.0.0.1:8080;
        }
}